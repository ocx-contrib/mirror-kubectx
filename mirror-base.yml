# Shared base for every spec in this repository (the kubectx project's tools).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# This repository is the unusual case the base was designed for: `kubectx` and
# `kubens` are TWO packages built from ONE upstream repository
# (`ahmetb/kubectx`). Every release tag ships both asset families, so both
# packages share the same tag grammar, the same version floor, the same archive
# shape and the same libc measurement. Everything below is therefore genuinely
# repo-wide — asserted once, not copy-pasted twice.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge.
#
# `platforms:` is DELIBERATELY ABSENT from this file. It carries both the
# runner matrix and the container legs, and each package rolls its platforms
# out in staged passes (linux → darwin → windows) on its own schedule, so each
# spec has to restate it in full anyway. Keeping a block here that every child
# replaces would be a shallow-merge trap with no upside — the same reasoning
# `mirror-kitware` applies when the matrix is downstream of a per-package libc
# measurement. Each spec's own `platforms:` block carries its measurement.

skip_prereleases: true
cascade: true

# Fleet rule. A cascade tag re-points on every re-publish; without a build
# segment the new manifest reuses the bare version tag and orphans the prior
# digest for registry GC, which breaks any `@sha256:` pin in a consumer's
# `ocx.lock`. The documented exception — a version that already carries semver
# build metadata, where `date` empties the mirror — does not apply: upstream
# tags are plain `vX.Y.Z` and versions are plain `0.11.0`.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # Assets are single static Go binaries, 5–26 MB each.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise for either package here. Both upstream
# archives are FLAT — `LICENSE` plus the single executable at the archive root,
# no wrapper directory and no `bin/` (verified by `tar tzvf` / `unzip -l`, see
# each spec's `asset_type:` comment). With `strip_components: 0` those land
# straight at the content root, so the only PATH entry is a bare
# `${installPath}`. `bin_scan` only looks BELOW an `${installPath}/<dir>` entry,
# so `auto`/`verify` is rejected at spec load with exit 65. `off` plus a
# hand-listed `binaries` in metadata.json is the blessed shape here.
bin_scan: off

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
